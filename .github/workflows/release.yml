name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the signing secrets before releasing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # Keep the keystore out of the workspace so it can never be archived
          # into an artifact or committed by a later step.
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed release
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name the artifacts after the version
        id: names
        run: |
          VERSION_NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          VERSION_CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          APK="tide-$VERSION_NAME-$VERSION_CODE.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "mapping=$(ls release-mappings/*.zip | head -1)" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          APK: ${{ steps.names.outputs.apk }}
          MAPPING: ${{ steps.names.outputs.mapping }}
          VERSION_NAME: ${{ steps.names.outputs.version_name }}
          VERSION_CODE: ${{ steps.names.outputs.version_code }}
        run: |
          NOTES=$(mktemp)
          {
            echo "Tide $VERSION_NAME (versionCode $VERSION_CODE)"
            echo
            echo "Signed release APK, minified with R8."
            echo
            echo "\`$(basename "$MAPPING")\` holds the R8 mapping for this build; it is"
            echo "required to read obfuscated stack traces from this APK."
          } > "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$MAPPING" --clobber
          else
            gh release create "$TAG" "$APK" "$MAPPING" \
              --title "Tide $VERSION_NAME" \
              --notes-file "$NOTES" \
              --generate-notes
          fi
